  <title>RebelsPrep</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f5f5;
      color: #171717;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    header { text-align: center; margin-bottom: 36px; }

      background: white;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 0;
      border-bottom: 1px solid #eee;
      font-weight: bold;
    }
    .option:last-of-type { border-bottom: 0; }
    .status { color: #666; font-size: 14px; font-weight: normal; }
    .notice {
      margin-top: 24px;
      padding: 16px;
      background: #f9eeee;
      border-left: 4px solid #bd1825;
      line-height: 1.5;
    }
    footer {
      text-align: center;
      color: #666;
      margin-top: 24px;
      font-size: 13px;
    }
  </style>
