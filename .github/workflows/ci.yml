name: RebelsPrep CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check shared.mjs
          node --check checkin-rp47.mjs
          node --check app-rpbuild43.mjs
          node --check scheduler.mjs
          node --check worker.mjs
          node --check roster-management.mjs
          node --check roster-store.mjs
          node --check roster-sync.mjs
          node --check roster-manager-ui.mjs
          node --check coach-roster-link.mjs
      - run: npm test
      - run: npm run test:rules
